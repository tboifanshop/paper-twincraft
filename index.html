<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>flash mobile overlay</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

<nav style="position:fixed;top:0;left:0;right:0;height:32px;background:rgba(0,0,0,0.85);display:flex;align-items:center;gap:12px;padding:0 10px;font-family:'Courier New',monospace;font-size:11px;z-index:9999;border-bottom:1px solid #5fa8d3;">
  <span style="color:#5fa8d3;">&#9670; DELTATUBE</span>
  <span style="color:#fff;">Home</span>
  <a href="shorts.html" style="color:#aaa;text-decoration:none;">&#9654; Shorts</a>
</nav>

<div id="app" style="margin-top:32px;">
  <div id="flash-wrapper">
    <ruffle-player id="player" tabindex="-1"></ruffle-player>
  </div>

  <div id="overlay">
    <div class="btn" data-key="ArrowLeft">◀</div>
    <div class="btn" data-key="ArrowRight">▶</div>
    <div class="btn" data-key="ArrowUp">▲</div>
    <div class="btn" data-key="ArrowDown">▼</div>
    <div class="btn action" data-key=" ">A</div>
  </div>
</div>

<div id="settings">
  <button id="loadSwf">load swf</button><br><br>

  <label>
    <input type="checkbox" id="toggleOverlay" checked>
    mobile controls
  </label><br>

  <label>
    <input type="checkbox" id="toggleFlashClick">
    disable flash click
  </label>
</div>

<input
  type="file"
  id="fileInput"
  style="position:absolute; left:-9999px;"
>

<script src="main.js"></script>
</body>
</html>
